{% extends "base.html" %}
{% block title %}{% if edit %}ویرایش کاربر{% else %}کاربر جدید{% endif %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body p-4">
        <h4 class="mb-4">{% if edit %}ویرایش کاربر{% else %}ایجاد کاربر جدید{% endif %}</h4>
        <form method="post">
          {% csrf_token %}
          {% if not edit %}
          <div class="mb-3">
            <label class="form-label">نام کاربری *</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label">نام کامل *</label>
            <input type="text" name="full_name" class="form-control" value="{{ edit_user.full_name|default:'' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">نقش</label>
            <select name="role" class="form-select">
              <option value="user" {% if edit_user.role == 'user' %}selected{% endif %}>کاربر</option>
              <option value="admin" {% if edit_user.role == 'admin' %}selected{% endif %}>ادمین</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">{% if edit %}رمز عبور جدید (خالی = بدون تغییر){% else %}رمز عبور *{% endif %}</label>
            <input type="password" name="password" class="form-control" {% if not edit %}required{% endif %}>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">ذخیره</button>
            <a href="{% url 'admin_users' %}" class="btn btn-outline-secondary">انصراف</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
