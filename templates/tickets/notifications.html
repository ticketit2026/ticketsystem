{% extends "base.html" %}
{% load jalali_tags %}
{% block title %}نوتیفیکیشن‌ها{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>نوتیفیکیشن‌ها</h4>
  <form method="post" action="{% url 'notifications_read_all' %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-primary btn-sm">همه را خوانده‌شده کن</button>
  </form>
</div>
<div class="card">
  <div class="list-group list-group-flush">
    {% for n in items %}
    <a href="{{ n.link }}" class="list-group-item list-group-item-action {% if not n.is_read %}list-group-item-primary{% endif %}">
      <div class="d-flex w-100 justify-content-between">
        <h6 class="mb-1">{{ n.title }}</h6>
        <small>{{ n.created_at|to_jalali }}</small>
      </div>
      <p class="mb-1 text-muted">{{ n.body }}</p>
    </a>
    {% empty %}
    <div class="list-group-item text-center text-muted py-4">نوتیفیکیشنی وجود ندارد</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
